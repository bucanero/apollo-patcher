name: Build Windows GUI

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  # x64 Windows build via MSYS2. (32-bit is handled by the win32-cross job below,
  # because MSYS2 no longer ships a working 32-bit toolchain — its MINGW32 target
  # silently produced x86-64 binaries.)
  msys:
    runs-on: windows-2022
    strategy:
      matrix:
        mingw: ["MINGW64"]
        include:
          - mingw: "MINGW64"
            package: "mingw-w64-x86_64"
    defaults:
      run:
        shell: bash.exe --login -eo pipefail "{0}"
    env:
      MSYSTEM: ${{ matrix.mingw }}
      CHERE_INVOKING: 1
    name: MSYS2 ${{ matrix.mingw }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout apollo-lib
        uses: actions/checkout@v4
        with:
          repository: bucanero/apollo-lib
          path: apollo-lib

      # The patch database the GUI browses, bundled into the artifact.
      - name: Checkout apollo-patches
        uses: actions/checkout@v4
        with:
          repository: bucanero/apollo-patches
          path: apollo-patches

      - name: Set up shell
        run: echo "C:\msys64\usr\bin\" >> $GITHUB_PATH
        shell: pwsh

      - name: Install MinGW requirements
        run: |
          uname
          echo "$GITHUB_WORKSPACE"
          # GUI build toolchain: CMake + Ninja (mingw) and git for FetchContent.

      - name: Install mbedTLS
        working-directory: apollo-lib
        run: |
          curl -sL https://src.fedoraproject.org/repo/pkgs/mbedtls/mbedtls-2.16.12.tar.gz/sha512/8d96d8cd906cc0999134320e4e1f550631426d166eab5da6e65469ee7286093810fcc6ac4bd5500ee55972d159f8bef7f9e53245f7f0eec72f72c35265b4313b/mbedtls-2.16.12.tar.gz | tar xvz -C ./
          cd mbedtls-2.16.12/library
          mkdir -p ../build/library
          CC=gcc make static
          cp libmbedcrypto.a ../build/library

      # The patch database is built by `cmake --build` here rather than by a
      # step of its own: apollo-patches is checked out in-tree, which is one of
      # the layouts CMakeLists.txt looks in. See build.yml for why one zip per
      # run rather than two.
      #
      # Python3_EXECUTABLE is passed explicitly because this is the one place
      # CMake might not find an interpreter on its own -- MSYS2's bash sees the
      # runner's Windows Python through the inherited PATH, and CMake's own
      # search does not necessarily look in the same places. The workflow has
      # already found it, so it is simply handed over.
      - name: Build Apollo Save Patcher (Desktop)
        run: |
          py=$(command -v python3 || command -v python)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$py"
          cmake --build build
          mkdir -p dist
          cp build/gui/apollo_patcher_gui.exe dist/
          if [ ! -f build/apollo-patches.zip ]; then
            echo "::error::CMake did not build apollo-patches.zip - see the"
            echo "::error::configure output above."
            exit 1
          fi
          cp build/apollo-patches.zip dist/
          # The font. Vendored in this repo, so its absence is a broken build
          # rather than a configuration: without it every trade mark sign and
          # every Japanese title draws as '?'.
          if [ ! -f build/gui/NotoSansJP-Medium.otf ]; then
            echo "::error::the build produced no font beside the executable"
            exit 1
          fi
          cp build/gui/NotoSansJP-Medium.otf build/gui/OFL.txt dist/

      # Ship a self-contained Mesa software opengl32.dll in a softgl/ subfolder of
      # the GUI artifact. It's NOT loaded by default (subfolder), so the app uses
      # the system GPU driver; if a user hits an OpenGL error (RDP / GPU-less) they
      # copy softgl\opengl32.dll next to the .exe to render in software. Mesa
      # 17.2.6 is old enough to be a single self-contained DLL and works on both
      # x86 and x64 / Windows 7.
      - name: Bundle software OpenGL fallback (Mesa 17.2.6, x64) under softgl/
        run: |
          curl -sL -o mesa.exe \
            "https://github.com/pal1000/mesa-dist-win/releases/download/17.2.6.500-1/mesa-17.2.6.500-1-sfx.exe"
          7z x -y -omesa mesa.exe
          mkdir -p dist/softgl
          cp mesa/x64/opengl32.dll dist/softgl/
          ls -lR dist/

      - name: Get short SHA
        run: echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-gui-${{ env.sha_name }}-${{matrix.mingw}}
          path: dist

  # Genuine 32-bit (x86) Windows build, cross-compiled on Linux with mingw-w64
  # (MSYS2 no longer provides a working 32-bit toolchain).
  win32-cross:
    runs-on: ubuntu-latest
    name: Windows x86 (Linux cross)
    env:
      TC: i686-w64-mingw32
    steps:
      - uses: actions/checkout@v4

      - name: Checkout apollo-lib
        uses: actions/checkout@v4
        with:
          repository: bucanero/apollo-lib
          path: apollo-lib

      # The patch database the GUI browses, bundled into the artifact.
      - name: Checkout apollo-patches
        uses: actions/checkout@v4
        with:
          repository: bucanero/apollo-patches
          path: apollo-patches

      - name: Install i686 mingw cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            libz-mingw-w64-dev cmake ninja-build p7zip-full

      - name: Fetch mbedTLS
        working-directory: apollo-lib
        run: |
          curl -sL https://src.fedoraproject.org/repo/pkgs/mbedtls/mbedtls-2.16.12.tar.gz/sha512/8d96d8cd906cc0999134320e4e1f550631426d166eab5da6e65469ee7286093810fcc6ac4bd5500ee55972d159f8bef7f9e53245f7f0eec72f72c35265b4313b/mbedtls-2.16.12.tar.gz | tar xz -C ./

      - name: Cross-build mbedcrypto (i686)
        run: |
          cmake -S apollo-lib/mbedtls-2.16.12 -B apollo-lib/mbedtls-2.16.12/build \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/gui/cmake/mingw-i686.cmake" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_PROGRAMS=OFF -DENABLE_TESTING=OFF
          cmake --build apollo-lib/mbedtls-2.16.12/build --target mbedcrypto -j
          ls -l apollo-lib/mbedtls-2.16.12/build/library/libmbedcrypto.a

      # As in the msys job: the zip comes out of the CMake build, not a step of
      # its own. Python3_EXECUTABLE matters more here than anywhere -- the
      # toolchain file sets CMAKE_SYSTEM_NAME to Windows, so CMake's own search
      # would look for a Windows interpreter while the only one present is this
      # Linux host's. It is a host tool, which the toolchain's
      # CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER already allows for.
      - name: Cross-build Apollo Save Patcher (i686)
        run: |
          py=$(command -v python3 || command -v python)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/gui/cmake/mingw-i686.cmake" \
            -DPython3_EXECUTABLE="$py"
          cmake --build build
          mkdir -p dist
          cp build/gui/apollo_patcher_gui.exe dist/
          file dist/apollo_patcher_gui.exe
          if [ ! -f build/apollo-patches.zip ]; then
            echo "::error::CMake did not build apollo-patches.zip - see the"
            echo "::error::configure output above."
            exit 1
          fi
          cp build/apollo-patches.zip dist/
          # The font. Vendored in this repo, so its absence is a broken build
          # rather than a configuration: without it every trade mark sign and
          # every Japanese title draws as '?'.
          if [ ! -f build/gui/NotoSansJP-Medium.otf ]; then
            echo "::error::the build produced no font beside the executable"
            exit 1
          fi
          cp build/gui/NotoSansJP-Medium.otf build/gui/OFL.txt dist/

      # Same self-contained Mesa 17.2.6 software opengl32.dll, x86, under softgl/.
      - name: Bundle software OpenGL fallback (Mesa 17.2.6, x86) under softgl/
        run: |
          curl -sL -o mesa.exe \
            "https://github.com/pal1000/mesa-dist-win/releases/download/17.2.6.500-1/mesa-17.2.6.500-1-sfx.exe"
          7z x -y -omesa mesa.exe
          mkdir -p dist/softgl
          cp mesa/x86/opengl32.dll dist/softgl/
          ls -lR dist/

      - name: Get short SHA
        run: echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-gui-${{ env.sha_name }}-win32
          path: dist
